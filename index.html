<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dash - Mobile Runner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            touch-action: manipulation; /* Отключаем зум по двойному тапу */
        }

        canvas {
            display: block;
        }

        /* Интерфейс */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #0ff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #0ff;
            pointer-events: none;
            z-index: 10;
        }

        #best-score {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            font-size: 18px;
        }

        /* Экраны старта и конца */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 16, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            text-align: center;
        }

        .hidden { display: none !important; }

        h1 {
            font-size: 40px;
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 30px;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 40px;
            line-height: 1.5;
            padding: 0 20px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #050510;
            background: #0ff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px #0ff;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        /* Анимация пульсации для старта */
        .pulse {
            animation: pulseAnim 1.5s infinite;
        }
        @keyframes pulseAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px #0ff; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score">0</div>
        <div id="best-score">РЕКОРД: 0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Экран Старта -->
    <div id="start-screen" class="overlay">
        <h1>Neon Dash</h1>
        <p>Нажимай на экран, чтобы прыгать.<br>Уворачивайся от красных шипов!</p>
        <button class="btn pulse" onclick="startGame()">Играть</button>
    </div>

    <!-- Экран Проигрыша -->
    <div id="game-over-screen" class="overlay hidden">
        <h2>ИГРА ОКОНЧЕНА</h2>
        <p>Твой счёт: <span id="final-score" style="color:#0ff; font-size:24px; font-weight:bold;">0</span></p>
        <button class="btn" onclick="startGame()">Ещё раз</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ЗВУКИ ---
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'score') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        // --- ЛОГИКА ---
        let isPlaying = false;
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('neonDashBest')) || 0;
        bestScoreEl.textContent = `РЕКОРД: ${bestScore}`;

        let gameSpeed = 6;
        let spawnTimer = 0;
        let spawnInterval = 90; // Кадров между шипами

        const player = {
            x: 50,
            y: 0,
            width: 30,
            height: 30,
            vy: 0,
            gravity: 0.6,
            jumpForce: -12,
            isGrounded: true
        };

        let obstacles = [];
        let particles = [];

        // Адаптация под экран (на телефоне персонаж чуть ниже)
        function resetPlayer() {
            player.y = height - player.height - 50;
            player.vy = 0;
            player.isGrounded = true;
        }

        // Управление
        function jump() {
            if (!isPlaying) return;
            if (player.isGrounded) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
                playSound('jump');
                createParticles(player.x, player.y + player.height, '#0ff', 5);
            }
        }

        // Обработка тапов (и клики мышкой для ПК)
        window.addEventListener('pointerdown', (e) => {
            initAudio(); // Разблокировка звука
            if (e.target.tagName !== 'BUTTON') {
                jump();
            }
        });

        function startGame() {
            initAudio();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            isPlaying = true;
            score = 0;
            gameSpeed = 6;
            spawnTimer = 0;
            spawnInterval = 90;
            obstacles = [];
            particles = [];
            
            resetPlayer();
            scoreEl.textContent = score;
            scoreEl.style.color = '#0ff';
            
            requestAnimationFrame(update);
        }

        function gameOver() {
            isPlaying = false;
            playSound('die');
            createParticles(player.x + player.width/2, player.y + player.height/2, '#ff0055', 30);
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('neonDashBest', bestScore);
                bestScoreEl.textContent = `РЕКОРД: ${bestScore}`;
            }

            finalScoreEl.textContent = score;
            setTimeout(() => {
                gameOverScreen.classList.remove('hidden');
            }, 500);
        }

        // Частицы для эффектов
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: color
                });
            }
        }

        // Основной игровой цикл
        function update() {
            if (!isPlaying) return;

            // Очистка экрана
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, width, height);

            // Рисуем неоновую сетку на полу (для скорости)
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            const floorY = height - 50;
            for (let i = 0; i < width; i += 40) {
                let offset = (Date.now() / 10) % 40;
                ctx.beginPath(); ctx.moveTo(i - offset, floorY); ctx.lineTo(i - offset + 20, height); ctx.stroke();
            }
            ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(width, floorY); ctx.stroke();

            // Физика игрока
            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y >= height - player.height - 50) {
                player.y = height - player.height - 50;
                player.vy = 0;
                player.isGrounded = true;
            }

            // Рисуем игрока (с неоновым свечением)
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#0ff';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Внутренний квадрат для стиля
            ctx.fillStyle = '#050510';
            ctx.fillRect(player.x + 5, player.y + 5, player.width - 10, player.height - 10);
            ctx.shadowBlur = 0;

            // Спавн препятствий
            spawnTimer++;
            if (spawnTimer > spawnInterval) {
                spawnTimer = 0;
                // Иногда спавним двойные шипы для сложности
                let isDouble = Math.random() > 0.8 && score > 20; 
                
                obstacles.push({
                    x: width,
                    y: height - 50 - (isDouble ? 40 : 20), // Высота шипа
                    width: isDouble ? 40 : 20,
                    height: isDouble ? 60 : 30,
                    counted: false // Для начисления очков
                });
            }

            // Логика препятствий
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff0055';
            ctx.fillStyle = '#ff0055';

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Рисуем шип (треугольник)
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width / 2, obs.y);
                ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                ctx.fill();

                // Проверка на столкновение (AABB)
                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    gameOver();
                    return;
                }

                // Начисление очков (пролетели шип)
                if (obs.x + obs.width < player.x && !obs.counted) {
                    obs.counted = true;
                    score++;
                    scoreEl.textContent = score;
                    playSound('score');
                    
                    // Ускорение игры каждые 5 очков
                    if (score % 5 === 0) {
                        gameSpeed += 0.5;
                    }
                }

                // Удаление ушедших за экран
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }
            ctx.shadowBlur = 0;

            // Логика частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                p.vy += 0.2; // гравитация для частиц

                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.fillRect(p.x, p.y, 4, 4);
                    ctx.globalAlpha = 1;
                }
            }

            requestAnimationFrame(update);
        }

        // Инициализация
        resetPlayer();
    </script>
</body>
</html>
