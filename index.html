<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash Clicker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');

        :root {
            --bg: #050510;
            --cyan: #00ffff;
            --magenta: #ff00ff;
            --yellow: #ffff00;
            --green: #39ff14;
            --panel: rgba(20, 20, 35, 0.9);
        }

        * {
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Неоновая сетка на фоне */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            perspective: 500px;
            transform: scale(1.5);
            animation: gridMove 2s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        /* Верхняя панель */
        #top-bar {
            width: 100%; max-width: 600px;
            display: flex; justify-content: space-between;
            padding: 20px; z-index: 10;
        }
        .stat-box {
            background: var(--panel);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-box span { display: block; color: var(--cyan); font-size: 24px; font-weight: 900; }
        .stat-box p { margin: 0; font-size: 12px; color: #aaa; }

        /* Игровое поле (Куб) */
        #click-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            cursor: pointer;
            z-index: 10;
        }

        #cube {
            width: 120px; height: 120px;
            background: var(--cyan);
            border: 4px solid #fff;
            box-shadow: 0 0 30px var(--cyan), inset 0 0 20px #fff;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        
        /* Лицо куба (чтобы было похоже на иконку из GD) */
        #cube::before {
            content: '👁️';
            font-size: 50px;
            filter: grayscale(1) brightness(0.2); /* Делаем глаз темным */
        }

        #cube.clicked {
            transform: scale(0.8) rotate(90deg);
            background: var(--magenta);
            box-shadow: 0 0 50px var(--magenta);
        }

        /* Всплывающий текст (+1) */
        .floating-text {
            position: absolute;
            color: var(--yellow);
            font-size: 24px;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px var(--yellow);
            z-index: 20;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* Магазин (Улучшения) */
        #shop {
            width: 100%; max-width: 600px;
            background: var(--panel);
            border-top: 4px solid var(--magenta);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -10px 30px rgba(255, 0, 255, 0.2);
        }

        .upgrade-btn {
            background: #111;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upgrade-btn:hover { border-color: var(--yellow); }
        .upgrade-btn:active { transform: scale(0.98); }
        
        .upgrade-btn.affordable {
            border-color: var(--green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .upg-info { text-align: left; }
        .upg-title { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 5px; }
        .upg-desc { font-size: 12px; color: #888; }
        
        .upg-cost {
            font-size: 18px;
            font-weight: 900;
            color: var(--green);
            background: rgba(57, 255, 20, 0.1);
            padding: 10px;
            border-radius: 8px;
        }
        .upg-cost.cant-afford { color: #ff3333; background: rgba(255, 51, 51, 0.1); }

        @media (min-width: 600px) {
            #shop { flex-direction: row; }
            .upgrade-btn { flex: 1; flex-direction: column; text-align: center; gap: 10px; }
            .upg-info { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div id="top-bar">
        <div class="stat-box">
            <span id="ui-orbs">0</span>
            <p>ОСКОЛКИ</p>
        </div>
        <div class="stat-box">
            <span id="ui-ops" style="color: var(--magenta); text-shadow: 0 0 10px var(--magenta);">0</span>
            <p>В СЕКУНДУ</p>
        </div>
    </div>

    <div id="click-area">
        <div id="cube"></div>
    </div>

    <div id="shop">
        <div class="upgrade-btn" id="btn-power" onclick="buyUpgrade('power')">
            <div class="upg-info">
                <div class="upg-title">Сила Куба (Ур. <span id="lvl-power">1</span>)</div>
                <div class="upg-desc">+1 осколок за клик</div>
            </div>
            <div class="upg-cost" id="cost-power">Цена: 10</div>
        </div>
        
        <div class="upgrade-btn" id="btn-auto" onclick="buyUpgrade('auto')">
            <div class="upg-info">
                <div class="upg-title">Дрон (Ур. <span id="lvl-auto">0</span>)</div>
                <div class="upg-desc">+1 осколок в секунду</div>
            </div>
            <div class="upg-cost" id="cost-auto">Цена: 50</div>
        </div>

        <div class="upgrade-btn" id="btn-mult" onclick="buyUpgrade('mult')">
            <div class="upg-info">
                <div class="upg-title">Мега-Буст (Ур. <span id="lvl-mult">0</span>)</div>
                <div class="upg-desc">x2 ко всему доходу</div>
            </div>
            <div class="upg-cost" id="cost-mult">Цена: 500</div>
        </div>
    </div>

    <script>
        // --- АУДИО ДВИЖОК ---
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        document.body.addEventListener('pointerdown', initAudio, { once: true });

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                // Звук прыжка (короткий высокий писк)
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'buy') {
                // Звук покупки (восходящее арпеджио)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        // --- СОСТОЯНИЕ ИГРЫ ---
        let orbs = 0;
        let clickPower = 1;
        let autoPower = 0;
        let multiplier = 1;

        let lvlPower = 1;
        let lvlAuto = 0;
        let lvlMult = 0;

        let costPower = 10;
        let costAuto = 50;
        let costMult = 500;

        // DOM Элементы
        const uiOrbs = document.getElementById('ui-orbs');
        const uiOps = document.getElementById('ui-ops');
        const cube = document.getElementById('cube');
        const clickArea = document.getElementById('click-area');

        // Загрузка сохранения
        function loadGame() {
            const saved = localStorage.getItem('gdClickerSave');
            if (saved) {
                const data = JSON.parse(saved);
                orbs = data.orbs || 0;
                clickPower = data.clickPower || 1;
                autoPower = data.autoPower || 0;
                multiplier = data.multiplier || 1;
                lvlPower = data.lvlPower || 1;
                lvlAuto = data.lvlAuto || 0;
                lvlMult = data.lvlMult || 0;
                costPower = data.costPower || 10;
                costAuto = data.costAuto || 50;
                costMult = data.costMult || 500;
            }
            updateUI();
        }

        // Сохранение
        function saveGame() {
            const data = { orbs, clickPower, autoPower, multiplier, lvlPower, lvlAuto, lvlMult, costPower, costAuto, costMult };
            localStorage.setItem('gdClickerSave', JSON.stringify(data));
        }

        // Обновление интерфейса
        function updateUI() {
            uiOrbs.textContent = Math.floor(orbs);
            uiOps.textContent = Math.floor(autoPower * multiplier);

            document.getElementById('lvl-power').textContent = lvlPower;
            document.getElementById('lvl-auto').textContent = lvlAuto;
            document.getElementById('lvl-mult').textContent = lvlMult;

            // Обновление цен и визуала
            updateShopBtn('btn-power', 'cost-power', costPower);
            updateShopBtn('btn-auto', 'cost-auto', costAuto);
            updateShopBtn('btn-mult', 'cost-mult', costMult);
        }

        function updateShopBtn(btnId, costId, cost) {
            const btn = document.getElementById(btnId);
            const costEl = document.getElementById(costId);
            
            costEl.textContent = `Цена: ${cost}`;
            
            if (orbs >= cost) {
                btn.classList.add('affordable');
                costEl.classList.remove('cant-afford');
            } else {
                btn.classList.remove('affordable');
                costEl.classList.add('cant-afford');
            }
        }

        // --- КЛИК ПО КУБУ ---
        clickArea.addEventListener('pointerdown', (e) => {
            initAudio();
            
            // Визуальный эффект
            cube.classList.add('clicked');
            setTimeout(() => cube.classList.remove('clicked'), 100);

            // Начисление осколков
            const gain = clickPower * multiplier;
            orbs += gain;
            
            // Звук
            playSound('click');

            // Всплывающий текст
            const rect = clickArea.getBoundingClientRect();
            const floatText = document.createElement('div');
            floatText.classList.add('floating-text');
            floatText.textContent = `+${gain}`;
            floatText.style.left = (e.clientX - 20) + 'px';
            floatText.style.top = (e.clientY - 20) + 'px';
            document.body.appendChild(floatText);
            
            setTimeout(() => floatText.remove(), 800);

            updateUI();
        });

        // --- МАГАЗИН ---
        function buyUpgrade(type) {
            initAudio();
            if (type === 'power' && orbs >= costPower) {
                orbs -= costPower;
                lvlPower++;
                clickPower += 1; // +1 к клику
                costPower = Math.floor(costPower * 1.5); // Дорожает
                playSound('buy');
            } 
            else if (type === 'auto' && orbs >= costAuto) {
                orbs -= costAuto;
                lvlAuto++;
                autoPower += 1; // +1 в секунду
                costAuto = Math.floor(costAuto * 1.6);
                playSound('buy');
            } 
            else if (type === 'mult' && orbs >= costMult) {
                orbs -= costMult;
                lvlMult++;
                multiplier *= 2; // x2 ко всему
                costMult = Math.floor(costMult * 3); // Очень дорогое
                playSound('buy');
            } 
            else {
                playSound('error');
                return;
            }
            updateUI();
            saveGame();
        }

        // --- ИГРОВОЙ ЦИКЛ (АВТОКЛИК) ---
        // Каждые 100мс добавляем часть дохода (делим на 10)
        setInterval(() => {
            if (autoPower > 0) {
                orbs += (autoPower * multiplier) / 10;
                updateUI();
            }
        }, 100);

        // Автосохранение каждые 5 секунд
        setInterval(saveGame, 5000);

        // Инициализация
        loadGame();
    </script>
</body>
</html>
