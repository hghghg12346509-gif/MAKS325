<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Кузнец Симулятор</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg: #2b2b2b;
            --dirt: #8b5a2b;
            --stone: #7f8c8d;
            --wood: #5c4033;
            --gold: #ffd700;
            --text: #fff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            background-image: 
                repeating-linear-gradient(45deg, #1a1a1a 25%, transparent 25%, transparent 75%, #1a1a1a 75%, #1a1a1a), 
                repeating-linear-gradient(45deg, #1a1a1a 25%, #222 25%, #222 75%, #1a1a1a 75%, #1a1a1a);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* ШАПКА (Ресурсы) */
        #top-bar {
            width: 100%; height: 60px;
            background: #111; border-bottom: 4px solid #000;
            display: flex; justify-content: space-around; align-items: center;
            font-size: 12px; z-index: 10;
        }
        .resource { display: flex; align-items: center; gap: 5px; }
        .resource span { color: var(--gold); font-size: 14px; }

        /* ИГРОВОЕ ПОЛЕ */
        #game-board {
            flex: 1;
            width: 100%;
            max-width: 600px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 5px;
            padding: 5px;
            background: #3e2723;
            position: relative;
        }

        /* Кузнечик на фоне */
        #grasshopper {
            position: absolute;
            bottom: 10px; left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            z-index: 1;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Станции */
        .station {
            background: var(--wood);
            border: 4px solid #000;
            border-top-color: #7a5443;
            border-left-color: #7a5443;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .station:active { transform: scale(0.95); }
        
        .station-icon { font-size: 50px; z-index: 2; filter: drop-shadow(2px 2px 0 #000); }
        .station-name { font-size: 8px; margin-top: 10px; background: rgba(0,0,0,0.7); padding: 4px; z-index: 2; }

        /* Визуальные эффекты */
        .particle {
            position: absolute; font-size: 20px; pointer-events: none;
            animation: pop 0.5s forwards; z-index: 5;
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }

        /* Эффект горения печи */
        .burning { background: #ff5722 !important; box-shadow: inset 0 0 30px #ff0000; }
        
        /* Трещины на камне */
        .cracked { animation: shake 0.2s; filter: brightness(0.7); }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } 100% { transform: translateX(0); } }

        /* Индикаторы прогресса (стрелочки) */
        .action-hint {
            position: absolute; top: 10px; right: 10px;
            font-size: 20px; animation: bounceHint 1s infinite alternate;
        }
        @keyframes bounceHint { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        .hidden { display: none !important; }

        /* МАГАЗИН УЛУЧШЕНИЙ */
        #shop {
            width: 100%;
            background: #222;
            border-top: 4px solid #000;
            padding: 10px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        .upg-btn {
            background: var(--stone);
            border: 3px solid #000;
            padding: 8px;
            min-width: 120px;
            text-align: center;
            font-size: 8px;
            color: #fff;
            cursor: pointer;
            flex-shrink: 0;
        }
        .upg-btn:active { transform: scale(0.95); }
        .upg-btn span { color: var(--gold); display: block; margin-top: 5px; font-size: 10px; }
        
        /* Сообщение от кузнечика */
        #gh-speech {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); border: 2px solid #4caf50; padding: 10px;
            font-size: 8px; color: #4caf50; z-index: 20; text-align: center; width: 80%; max-width: 400px;
            pointer-events: none; transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <!-- Ресурсы -->
    <div id="top-bar">
        <div class="resource">🪨 <span id="ui-ore">0</span></div>
        <div class="resource">🟨 <span id="ui-ingot">0</span></div>
        <div class="resource">⚔️ <span id="ui-sword">0</span></div>
        <div class="resource">🪙 <span id="ui-coin">0</span></div>
    </div>

    <!-- Подсказка кузнечика -->
    <div id="gh-speech">Привет! Начни копать руду (🪨)!</div>

    <!-- Игровое поле -->
    <div id="game-board">
        <div id="grasshopper">🦗</div>

        <!-- 1. РУДНИК -->
        <div class="station" id="st-mine" onclick="mineOre()">
            <div class="station-icon" id="icon-mine">🪨</div>
            <div class="station-name">ШАХТА</div>
            <div class="action-hint" id="hint-mine">⛏️</div>
        </div>

        <!-- 2. ПЕЧЬ -->
        <div class="station" id="st-furnace" onclick="smeltOre()">
            <div class="station-icon" id="icon-furnace">🔥</div>
            <div class="station-name">ПЕЧЬ</div>
            <div class="action-hint hidden" id="hint-furnace">🪨</div>
        </div>

        <!-- 3. НАКОВАЛЬНЯ -->
        <div class="station" id="st-anvil" onclick="forgeSword()">
            <div class="station-icon" id="icon-anvil">⚒️</div>
            <div class="station-name">НАКОВАЛЬНЯ</div>
            <div class="action-hint hidden" id="hint-anvil">🟨</div>
        </div>

        <!-- 4. ПРОДАЖА -->
        <div class="station" id="st-shop" onclick="sellSword()">
            <div class="station-icon" id="icon-shop">🏪</div>
            <div class="station-name">ПРОДАЖА</div>
            <div class="action-hint hidden" id="hint-shop">⚔️</div>
        </div>
    </div>

    <!-- Улучшения -->
    <div id="shop">
        <div class="upg-btn" onclick="upgrade('pickaxe')">КИРКА<span id="cost-pickaxe">50🪙</span></div>
        <div class="upg-btn" onclick="upgrade('furnace')">ПЕЧЬ<span id="cost-furnace">80🪙</span></div>
        <div class="upg-btn" onclick="upgrade('anvil')">МОЛОТ<span id="cost-anvil">100🪙</span></div>
    </div>

    <script>
        // --- ЗВУКИ (Web Audio API) ---
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        document.body.addEventListener('pointerdown', initAudio, { once: true });

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'hit') { // Удар киркой/молотом
                osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'smelt') { // Шипение печи
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'sell') { // Звон монет
                osc.type = 'sine'; osc.frequency.setValueAtTime(988, now); osc.frequency.setValueAtTime(1319, now + 0.1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'upgrade') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        // --- СОСТОЯНИЕ ИГРЫ ---
        let ore = 0, ingots = 0, swords = 0, coins = 0;
        
        let pickaxeLvl = 1;
        let furnaceLvl = 1;
        let anvilLvl = 1;

        let costPickaxe = 50, costFurnace = 80, costAnvil = 100;

        // Таймеры и флаги
        let isSmelting = false;
        let forgeHits = 0;
        let maxForgeHits = 3 - (anvilLvl > 3 ? 1 : 0); // На высоком уровне нужно меньше ударов
        let mineHits = 0, maxMineHits = 4;

        // DOM
        const uiOre = document.getElementById('ui-ore');
        const uiIngot = document.getElementById('ui-ingot');
        const uiSword = document.getElementById('ui-sword');
        const uiCoin = document.getElementById('ui-coin');
        const ghSpeech = document.getElementById('gh-speech');
        
        const hintFurnace = document.getElementById('hint-furnace');
        const hintAnvil = document.getElementById('hint-anvil');
        const hintShop = document.getElementById('hint-shop');
        const iconAnvil = document.getElementById('icon-anvil');
        const stFurnace = document.getElementById('st-furnace');
        const iconMine = document.getElementById('icon-mine');

        function updateUI() {
            uiOre.textContent = ore;
            uiIngot.textContent = ingots;
            uiSword.textContent = swords;
            uiCoin.textContent = coins;

            // Показываем подсказки (стрелочки)
            hintFurnace.classList.toggle('hidden', ore === 0 || isSmelting);
            hintAnvil.classList.toggle('hidden', ingots === 0 || swords > 0);
            hintShop.classList.toggle('hidden', swords === 0);
            
            // Обновляем цены
            document.getElementById('cost-pickaxe').textContent = costPickaxe + '🪙';
            document.getElementById('cost-furnace').textContent = costFurnace + '🪙';
            document.getElementById('cost-anvil').textContent = costAnvil + '🪙';
        }

        function say(text) {
            ghSpeech.textContent = text;
            ghSpeech.style.opacity = '1';
            setTimeout(() => { ghSpeech.style.opacity = '0'; }, 3000);
        }

        function createParticle(x, y, emoji) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.textContent = emoji;
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 500);
        }

        // --- 1. ШАХТА ---
        function mineOre() {
            if (isSmelting) return; // Нельзя копать во время плавки (для баланса)
            
            playSound('hit');
            iconMine.classList.add('cracked');
            setTimeout(() => iconMine.classList.remove('cracked'), 200);

            const rect = document.getElementById('st-mine').getBoundingClientRect();
            createParticle(rect.left + rect.width/2, rect.top + rect.height/2, '💥');

            mineHits++;
            if (mineHits >= maxMineHits) {
                mineHits = 0;
                ore += pickaxeLvl;
                updateUI();
                createParticle(rect.left + rect.width/2, rect.top + rect.height/2, '🪨');
                say(`+${pickaxeLvl} руды! Отнеси в печь.`);
            }
        }

        // --- 2. ПЕЧЬ ---
        function smeltOre() {
            if (ore <= 0) { playSound('error'); say("Нет руды! Сначала накопай."); return; }
            if (isSmelting) { say("Печь уже работает!"); return; }

            ore--;
            isSmelting = true;
            stFurnace.classList.add('burning');
            playSound('smelt');
            updateUI();
            say("Плавлю руду...");

            // Время плавки зависит от уровня печи (чем выше, тем быстрее)
            const smeltTime = Math.max(1000, 3000 - (furnaceLvl * 500));

            setTimeout(() => {
                isSmelting = false;
                stFurnace.classList.remove('burning');
                ingots++;
                playSound('sell'); // Звук готовности
                say("Слиток готов! Тащи на наковальню.");
                updateUI();
            }, smeltTime);
        }

        // --- 3. НАКОВАЛЬНЯ ---
        function forgeSword() {
            if (swords > 0) { playSound('error'); say("У тебя уже есть меч! Иди продавай."); return; }
            if (ingots <= 0) { playSound('error'); say("Нужен слиток!"); return; }

            playSound('hit');
            
            // Анимация удара
            iconAnvil.style.transform = 'scale(0.8)';
            setTimeout(() => iconAnvil.style.transform = 'scale(1)', 100);

            const rect = document.getElementById('st-anvil').getBoundingClientRect();
            createParticle(rect.left + rect.width/2, rect.top + rect.height/2, '✨');

            forgeHits++;
            if (forgeHits >= maxForgeHits) {
                forgeHits = 0;
                ingots--;
                swords++;
                updateUI();
                say("Меч выкован! Неси на продажу.");
                playSound('sell');
            } else {
                say(`Ещё удар! (${forgeHits}/${maxForgeHits})`);
            }
        }

        // --- 4. ПРОДАЖА ---
        function sellSword() {
            if (swords <= 0) { playSound('error'); say("Нечего продавать!"); return; }

            swords--;
            // Цена меча зависит от уровня наковальни
            const price = 20 + (anvilLvl * 10); 
            coins += price;
            playSound('sell');
            updateUI();
            
            const rect = document.getElementById('st-shop').getBoundingClientRect();
            createParticle(rect.left + rect.width/2, rect.top + rect.height/2, '🪙');
            say(`Продано за ${price} монет!`);
        }

        // --- УЛУЧШЕНИЯ ---
        function upgrade(type) {
            playSound('error'); // По умолчанию звук ошибки

            if (type === 'pickaxe' && coins >= costPickaxe) {
                coins -= costPickaxe;
                pickaxeLvl++;
                costPickaxe = Math.floor(costPickaxe * 1.8);
                maxMineHits = Math.max(2, maxMineHits - 1); // Копать станет легче
                playSound('upgrade'); say("Кирка улучшена! Копаем быстрее.");
            } 
            else if (type === 'furnace' && coins >= costFurnace) {
                coins -= costFurnace;
                furnaceLvl++;
                costFurnace = Math.floor(costFurnace * 1.8);
                playSound('upgrade'); say("Печь улучшена! Плавит быстрее.");
            } 
            else if (type === 'anvil' && coins >= costAnvil) {
                coins -= costAnvil;
                anvilLvl++;
                costAnvil = Math.floor(costAnvil * 1.8);
                maxForgeHits = Math.max(1, maxForgeHits - 1); // Нужно меньше ударов
                playSound('upgrade'); say("Молот улучшен! Мечи дороже.");
            } 
            else {
                say("Не хватает монет!");
                return;
            }
            updateUI();
        }

        // Инициализация
        updateUI();
    </script>
</body>
</html>
