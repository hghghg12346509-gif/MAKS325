<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- ВАЖНО ДЛЯ ТЕЛЕФОНА: масштаб и отключение зума при двойном тапе -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мега Тапалка</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1a2e;
            --btn-color: #e94560;
            --text: #ffffff;
            --accent: #0f3460;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Montserrat', sans-serif; 
            user-select: none; 
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text); 
            height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            touch-action: manipulation; 
        }

        /* --- ЭКРАНЫ --- */
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 20px; text-align: center; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* --- МЕНЮ (ВЫБОР УРОВНЯ) --- */
        h1 { font-size: 36px; margin-bottom: 10px; color: #fff; text-shadow: 0 0 10px var(--btn-color); }
        .subtitle { font-size: 16px; color: #aaa; margin-bottom: 30px; }
        
        .levels-container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        .level-btn {
            background: var(--accent); color: white; border: 3px solid transparent; 
            padding: 20px; border-radius: 20px; font-size: 22px; font-weight: 900;
            box-shadow: 0 6px 0 #091c35; transition: 0.1s; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer;
        }
        .level-btn:active { transform: translateY(6px); box-shadow: none; }
        .level-btn.locked { background: #333; color: #666; box-shadow: 0 6px 0 #222; cursor: not-allowed; }
        .level-desc { font-size: 14px; color: #ccc; font-weight: 700; display: block; margin-top: 5px; }
        
        /* Цвета уровней */
        .level-btn[data-id="1"] { --btn-bg: #32cd32; --shadow: #228b22; }
        .level-btn[data-id="2"] { --btn-bg: #ffd700; --shadow: #daa520; color: #333;}
        .level-btn[data-id="3"] { --btn-bg: #ff8c00; --shadow: #cc7000; }
        .level-btn[data-id="4"] { --btn-bg: #ff4500; --shadow: #b22222; }
        .level-btn[data-id="5"] { --btn-bg: #8b0000; --shadow: #4a0000; }
        
        .level-btn.unlocked { background: var(--btn-bg); box-shadow: 0 6px 0 var(--shadow); }

        /* --- ИГРОВОЙ ЭКРАН --- */
        #game-screen { justify-content: space-between; padding: 40px 20px; }
        
        .top-bar { width: 100%; display: flex; justify-content: space-between; font-size: 28px; font-weight: 900; }
        .timer { color: #fff; }
        .timer.danger { color: var(--btn-color); animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
        
        .score-display { font-size: 60px; font-weight: 900; margin-top: 20px; }
        .target-text { font-size: 20px; color: #aaa; margin-bottom: 20px; }
        
        /* Прогресс-бар */
        .progress-container { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin-bottom: 30px; border: 2px solid #555; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--btn-color), #ff8c00); transition: width 0.1s; }

        /* ОГРОМНАЯ КНОПКА */
        .tap-button {
            width: 70vw; height: 70vw; max-width: 350px; max-height: 350px;
            border-radius: 50%; background: radial-gradient(circle, #e94560, #a3122a);
            border: 10px solid #fff; box-shadow: 0 15px 0 #5a0010, 0 20px 20px rgba(0,0,0,0.5);
            font-size: 60px; font-weight: 900; color: white;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: transform 0.05s, box-shadow 0.05s;
            margin: 20px auto;
        }
        /* Класс для визуального нажатия с клавиатуры */
        .tap-button.pressed {
            transform: translateY(15px) scale(0.95);
            box-shadow: 0 0 0 #5a0010, 0 5px 10px rgba(0,0,0,0.5);
        }

        .btn-back {
            background: #444; color: white; border: none; padding: 15px 30px; border-radius: 15px; 
            font-size: 18px; font-weight: 900; margin-top: 20px; box-shadow: 0 5px 0 #222;
            cursor: pointer;
        }
        .btn-back:active { transform: translateY(5px); box-shadow: none; }

        /* --- ЭКРАН РЕЗУЛЬТАТА --- */
        .result-title { font-size: 50px; font-weight: 900; margin-bottom: 10px; }
        .result-title.win { color: #32cd32; text-shadow: 0 0 20px #32cd32; }
        .result-title.lose { color: var(--btn-color); text-shadow: 0 0 20px var(--btn-color); }
        .result-emoji { font-size: 100px; margin: 20px 0; }
        .result-stats { font-size: 24px; margin-bottom: 30px; color: #ccc; }
        
        .btn-action {
            background: var(--btn-color); color: white; border: none; padding: 20px 40px; border-radius: 20px; 
            font-size: 24px; font-weight: 900; width: 100%; max-width: 300px; box-shadow: 0 8px 0 #a3122a;
            margin-bottom: 15px; cursor: pointer;
        }
        .btn-action:active { transform: translateY(8px); box-shadow: none; }

        /* --- ЧАСТИЦЫ И ТРЯСКА --- */
        .particle { position: fixed; pointer-events: none; font-size: 30px; animation: popOut 0.5s ease-out forwards; z-index: 100; }
        @keyframes popOut { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; } }
        
        .shake { animation: shakeScreen 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeScreen {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
    </style>
</head>
<body>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menu-screen" class="screen active">
        <h1>🔥 МЕГА ТАПАЛКА</h1>
        <div class="subtitle">Жми на кнопку, пока не вышло время!</div>
        <div class="levels-container" id="levels-container"></div>
    </div>

    <!-- ИГРА -->
    <div id="game-screen" class="screen">
        <div style="width: 100%;">
            <div class="top-bar">
                <div class="timer" id="timer-display">00:00</div>
                <div id="level-name-display" style="color: #888;">Уровень</div>
            </div>
            
            <div style="text-align: center;">
                <div class="score-display" id="score-display">0</div>
                <div class="target-text">Цель: <span id="target-display">0</span></div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="tap-button" id="tap-btn">ТАП</div>

        <button class="btn-back" onclick="backToMenu()">← Сдаться</button>
    </div>

    <!-- РЕЗУЛЬТАТ -->
    <div id="result-screen" class="screen">
        <div class="result-title" id="result-title">ПОБЕДА</div>
        <div class="result-emoji" id="result-emoji">🏆</div>
        <div class="result-stats" id="result-stats">Ты сделал 0 кликов</div>
        <button class="btn-action" id="next-level-btn" onclick="nextLevel()">Дальше</button>
        <button class="btn-action" style="background: #444; box-shadow: 0 8px 0 #222;" onclick="backToMenu()">В меню</button>
    </div>

    <script>
        // --- НАСТРОЙКИ УРОВНЕЙ ---
        const levels = [
            { id: 1, name: "Легкий", target: 30, time: 20, color: "#32cd32" },
            { id: 2, name: "Средний", target: 60, time: 20, color: "#ffd700" },
            { id: 3, name: "Сложный", target: 100, time: 20, color: "#ff8c00" },
            { id: 4, name: "Очень сложный", target: 150, time: 20, color: "#ff4500" },
            { id: 5, name: "ХАРДКОР", target: 200, time: 20, color: "#8b0000" }
        ];

        let unlockedLevel = parseInt(localStorage.getItem('tapUnlocked')) || 1;
        let currentLevelIndex = 0;
        let taps = 0;
        let timeLeft = 0;
        let gameInterval = null;
        let isPlaying = false;

        // DOM Элементы
        const levelsContainer = document.getElementById('levels-container');
        const timerDisplay = document.getElementById('timer-display');
        const scoreDisplay = document.getElementById('score-display');
        const targetDisplay = document.getElementById('target-display');
        const progressBar = document.getElementById('progress-bar');
        const levelNameDisplay = document.getElementById('level-name-display');
        const tapBtn = document.getElementById('tap-btn');
        
        // --- ВИБРАЦИЯ ---
        function vibrate(ms) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        // --- ЗВУКИ ---
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        // Инициализируем звук при первом клике или нажатии клавиши
        document.body.addEventListener('pointerdown', initAudio, { once: true });
        document.body.addEventListener('keydown', initAudio, { once: true });

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;

            if (type === 'tap') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400 + Math.random()*100, now); 
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); 
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'win') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.1); osc.frequency.setValueAtTime(800, now + 0.2); osc.frequency.setValueAtTime(1000, now + 0.3);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5); osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'lose') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(50, now + 0.5);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5); osc.start(now); osc.stop(now + 0.5);
            }
        }

        // --- ОТРИСОВКА МЕНЮ ---
        function renderMenu() {
            levelsContainer.innerHTML = '';
            levels.forEach((lvl, index) => {
                const btn = document.createElement('button');
                const isUnlocked = lvl.id <= unlockedLevel;
                
                btn.className = `level-btn ${isUnlocked ? 'unlocked' : 'locked'}`;
                btn.setAttribute('data-id', lvl.id);
                
                if (isUnlocked) {
                    btn.innerHTML = `<div>${lvl.name} <span class="level-desc">${lvl.target} тапов за ${lvl.time} сек</span></div>`;
                    btn.onclick = () => startGame(index);
                } else {
                    btn.innerHTML = `<div>🔒 Закрыто</div>`;
                }
                levelsContainer.appendChild(btn);
            });
        }

        // --- НАВИГАЦИЯ ---
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function backToMenu() {
            isPlaying = false;
            clearInterval(gameInterval);
            switchScreen('menu-screen');
            renderMenu();
        }

        // --- ЛОГИКА ИГРЫ ---
        function startGame(levelIndex) {
            currentLevelIndex = levelIndex;
            const level = levels[levelIndex];
            
            taps = 0;
            timeLeft = level.time;
            isPlaying = true;
            
            scoreDisplay.textContent = taps;
            targetDisplay.textContent = level.target;
            levelNameDisplay.textContent = level.name;
            progressBar.style.width = '0%';
            timerDisplay.classList.remove('danger');
            updateTimerDisplay();

            switchScreen('game-screen');
            
            clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                if (!isPlaying) return;
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 5 && timeLeft > 0) {
                    timerDisplay.classList.add('danger');
                }

                if (timeLeft <= 0) {
                    endGame(false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
        }

        // --- ЕДИНАЯ ФУНКЦИЯ ТАПА ---
        function processTap(x, y) {
            if (!isPlaying) return;
            
            taps++;
            scoreDisplay.textContent = taps;
            playSound('tap');
            vibrate(15); 
            
            const progress = Math.min((taps / levels[currentLevelIndex].target) * 100, 100);
            progressBar.style.width = progress + '%';

            if (taps % 10 === 0) {
                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 300);
            }

            // Если координаты не переданы (нажали на клавиатуру), берем центр кнопки
            if (x === undefined || y === undefined) {
                const rect = tapBtn.getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top + rect.height / 2;
            }

            createParticle(x, y);

            if (taps >= levels[currentLevelIndex].target) {
                endGame(true);
            }
        }

        // 1. Тап мышкой или пальцем
        tapBtn.addEventListener('pointerdown', (e) => {
            processTap(e.clientX, e.clientY);
        });

        // 2. Тап с клавиатуры (Пробел и Enter)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault(); // Чтобы страница не скроллилась пробелом
                
                // Визуальный эффект нажатия кнопки
                tapBtn.classList.add('pressed');
                setTimeout(() => tapBtn.classList.remove('pressed'), 50);

                processTap();
            }
        });

        // Запрет на контекстное меню (при долгом зажатии на телефоне)
        tapBtn.addEventListener('contextmenu', e => e.preventDefault());

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const emojis = ['⭐', '🔥', '💥', '⚡', '👍', '💪'];
            particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            const tx = (Math.random() - 0.5) * 200;
            const ty = (Math.random() - 0.5) * 200 - 50; 
            particle.style.setProperty('--tx', tx + 'px');
            particle.style.setProperty('--ty', ty + 'px');
            
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 500);
        }

        function endGame(isWin) {
            isPlaying = false;
            clearInterval(gameInterval);
            
            const title = document.getElementById('result-title');
            const emoji = document.getElementById('result-emoji');
            const stats = document.getElementById('result-stats');
            const nextBtn = document.getElementById('next-level-btn');

            if (isWin) {
                playSound('win');
                vibrate([50, 50, 50, 50, 100]); 
                title.textContent = "ПОБЕДА!";
                title.className = "result-title win";
                emoji.textContent = "🏆";
                stats.textContent = `Ты сделал ${taps} тапов!`;
                
                if (levels[currentLevelIndex].id === unlockedLevel && unlockedLevel < levels.length) {
                    unlockedLevel++;
                    localStorage.setItem('tapUnlocked', unlockedLevel);
                }

                if (currentLevelIndex < levels.length - 1) {
                    nextBtn.style.display = 'block';
                } else {
                    nextBtn.style.display = 'none'; 
                    stats.textContent = "ТЫ ПРОШЕЛ ВСЮ ИГРУ! КРАСАВА! 👑";
                }
            } else {
                playSound('lose');
                vibrate([100, 100, 100]); 
                title.textContent = "ВРЕМЯ ВЫШЛО";
                title.className = "result-title lose";
                emoji.textContent = "💀";
                stats.textContent = `Не хватило ${levels[currentLevelIndex].target - taps} тапов...`;
                nextBtn.style.display = 'none';
            }

            switchScreen('result-screen');
        }

        function nextLevel() {
            if (currentLevelIndex < levels.length - 1) {
                startGame(currentLevelIndex + 1);
            }
        }

        // Запуск
        renderMenu();
    </script>
</body>
</html>
