<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper: Room Clear</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            cursor: none; /* Скрываем обычный курсор */
            user-select: none;
        }

        /* Комната (фон) */
        #room {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #1a1a1a;
            background-image: 
                linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222),
                linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222);
            background-size: 100px 100px;
            background-position: 0 0, 50px 50px;
            overflow: hidden;
        }

        /* Мебель и укрытия (для атмосферы) */
        .prop {
            position: absolute;
            font-size: 80px;
            opacity: 0.7;
            pointer-events: none; /* Не мешают кликам */
            filter: drop-shadow(0 0 10px #000);
        }

        /* Враги */
        .enemy {
            position: absolute;
            font-size: 50px;
            cursor: crosshair;
            transition: transform 0.1s;
            z-index: 10;
        }
        .enemy:active { transform: scale(0.8); }

        /* Кровь */
        .blood {
            position: absolute;
            color: #ff0000;
            font-size: 60px;
            pointer-events: none;
            animation: splatter 1s ease-out forwards;
            z-index: 20;
        }
        @keyframes splatter {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2) translateY(20px); opacity: 0; }
        }

        /* --- ПРИЦЕЛ --- */
        #scope {
            position: absolute;
            width: 60vh; /* Размер прицела */
            height: 60vh;
            border-radius: 50%;
            border: 3px solid rgba(255, 0, 0, 0.6);
            /* Магия туннельного зрения: огромная тень закрывает всё остальное */
            box-shadow: 0 0 0 100vw rgba(0, 0, 0, 0.95), inset 0 0 50px rgba(0, 0, 0, 0.8);
            pointer-events: none; /* Клики проходят сквозь прицел на врагов */
            z-index: 100;
            transform: translate(-50%, -50%); /* Центрируем по мышке */
        }

        /* Перекрестие внутри прицела */
        #scope::before, #scope::after {
            content: '';
            position: absolute;
            background: rgba(255, 0, 0, 0.6);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        #scope::before { width: 100%; height: 2px; } /* Горизонталь */
        #scope::after { width: 2px; height: 100%; } /* Вертикаль */

        /* Точка в центре */
        #crosshair-dot {
            position: absolute;
            width: 6px; height: 6px;
            background: #ff0000;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ff0000;
        }

        /* --- ИНТЕРФЕЙС --- */
        #ui {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 200;
            pointer-events: none;
            color: #fff;
            text-shadow: 0 0 5px #000;
        }

        .ui-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border: 2px solid #555;
            border-radius: 5px;
            font-size: 20px;
            font-weight: bold;
        }

        .ammo-box { color: #ffcc00; }
        .ammo-box.empty { color: #ff0000; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .score-box { color: #00ff00; }

        /* ЭКРАНЫ СТАРТА И КОНЦА */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: #fff;
            cursor: default;
            text-align: center;
        }

        h1 {
            color: #ff3333;
            font-size: 50px;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px #ff3333;
            text-transform: uppercase;
        }

        p { font-size: 20px; margin-bottom: 30px; color: #ccc; }

        .btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background: #333;
            border: 2px solid #ff3333;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.3);
        }
        .btn:hover { background: #ff3333; box-shadow: 0 0 30px #ff3333; }

        /* Эффект вспышки при выстреле */
        #muzzle-flash {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            z-index: 150;
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- Комната -->
    <div id="room">
        <!-- Мебель -->
        <div class="prop" style="top: 10%; left: 5%;">🛋️</div>
        <div class="prop" style="top: 60%; left: 15%;">📦</div>
        <div class="prop" style="top: 20%; right: 10%;">🪴</div>
        <div class="prop" style="bottom: 10%; right: 5%;">🗄️</div>
        <div class="prop" style="top: 40%; left: 45%;">🖼️</div>
    </div>

    <!-- Прицел -->
    <div id="scope">
        <div id="crosshair-dot"></div>
    </div>

    <!-- Вспышка -->
    <div id="muzzle-flash"></div>

    <!-- Интерфейс -->
    <div id="ui">
        <div class="ui-box ammo-box" id="ammo-display">🔫 Патроны: 5 / 5</div>
        <div class="ui-box score-box" id="score-display">🎯 Убито: 0 / 10</div>
    </div>

    <!-- Экран старта/конца -->
    <div id="overlay">
        <h1 id="overlay-title">Снайпер: Зачистка</h1>
        <p id="overlay-text">Найди и уничтожь 10 целей в комнате.<br>Стреляй кликом мыши. Перезарядка — клавиша R.</p>
        <button class="btn" id="start-btn" onclick="startGame()">Начать миссию</button>
    </div>

    <script>
        // --- ЗВУКОВОЙ ДВИЖОК ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'shot') {
                // Резкий выстрел
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'reload') {
                // Звук перезарядки (два щелчка)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
                
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
                    osc2.connect(gain2); gain2.connect(audioCtx.destination);
                    osc2.type = 'triangle'; osc2.frequency.setValueAtTime(600, now + 0.2);
                    gain2.gain.setValueAtTime(0.2, now + 0.2); gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc2.start(now + 0.2); osc2.stop(now + 0.3);
                }, 200);
            } else if (type === 'hit') {
                // Звук попадания (глухой удар)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'empty') {
                // Звук пустого магазина
                osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        // --- ИГРОВАЯ ЛОГИКА ---
        const scope = document.getElementById('scope');
        const room = document.getElementById('room');
        const ammoDisplay = document.getElementById('ammo-display');
        const scoreDisplay = document.getElementById('score-display');
        const overlay = document.getElementById('overlay');
        const muzzleFlash = document.getElementById('muzzle-flash');

        let isPlaying = false;
        let maxAmmo = 5;
        let currentAmmo = 5;
        let kills = 0;
        let targetKills = 10;
        let isReloading = false;
        
        let spawnTimeout;
        let hideTimeout;
        let enemies = [];

        // Враги (разные персонажи)
        const enemyTypes = ['🤠', '🕵️', '🥷', '🧟', '👤', '🎯'];
        
        // Движение прицела за мышкой
        window.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            scope.style.left = e.clientX + 'px';
            scope.style.top = e.clientY + 'px';
        });

        // Выстрел
        window.addEventListener('mousedown', (e) => {
            if (!isPlaying) return;
            
            // Если кликнули по кнопке интерфейса - игнорируем выстрел
            if (e.target.tagName === 'BUTTON') return;

            shoot(e.clientX, e.clientY);
        });

        // Перезарядка на клавишу R
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && isPlaying) {
                reload();
            }
        });

        function startGame() {
            initAudio();
            overlay.style.display = 'none';
            isPlaying = true;
            kills = 0;
            currentAmmo = maxAmmo;
            isReloading = false;
            
            // Очистка комнаты от старых врагов/крови
            document.querySelectorAll('.enemy').forEach(el => el.remove());
            document.querySelectorAll('.blood').forEach(el => el.remove());
            enemies = [];
            
            updateUI();
            spawnEnemy(); // Запуск спавна
        }

        function updateUI() {
            ammoDisplay.textContent = `🔫 Патроны: ${currentAmmo} / ${maxAmmo}`;
            if (currentAmmo === 0) ammoDisplay.classList.add('empty');
            else ammoDisplay.classList.remove('empty');
            
            scoreDisplay.textContent = `🎯 Убито: ${kills} / ${targetKills}`;
        }

        function reload() {
            if (isReloading || currentAmmo === maxAmmo || !isPlaying) return;
            isReloading = true;
            playSound('reload');
            ammoDisplay.textContent = '🔄 Перезарядка...';
            
            setTimeout(() => {
                currentAmmo = maxAmmo;
                isReloading = false;
                updateUI();
            }, 1000); // 1 секунда на перезарядку
        }

        function shoot(x, y) {
            if (isReloading) return;
            
            if (currentAmmo <= 0) {
                playSound('empty');
                return;
            }

            // Тратим патрон
            currentAmmo--;
            updateUI();
            playSound('shot');
            
            // Вспышка
            muzzleFlash.style.opacity = '1';
            setTimeout(() => muzzleFlash.style.opacity = '0', 50);

            // Проверка попадания
            // elementFromPoint вернет элемент, который находится под курсором
            // Временно скрываем прицел, чтобы он не перекрывал клик
            scope.style.display = 'none'; 
            const hitElement = document.elementFromPoint(x, y);
            scope.style.display = 'block';

            if (hitElement && hitElement.classList.contains('enemy')) {
                // ПОПАДАНИЕ
                killEnemy(hitElement);
            } else {
                // ПРОМАХ (оставляем дырку от пули)
                createBulletHole(x, y);
            }

            // Если патроны кончились, автоматически перезаряжаем через 1 секунду
            if (currentAmmo === 0 && kills < targetKills) {
                setTimeout(reload, 500);
            }
        }

        function killEnemy(enemy) {
            playSound('hit');
            kills++;
            updateUI();

            // Кровь на месте врага
            const blood = document.createElement('div');
            blood.classList.add('blood');
            blood.textContent = '🩸';
            blood.style.left = enemy.style.left;
            blood.style.top = enemy.style.top;
            room.appendChild(blood);
            
            setTimeout(() => blood.remove(), 1000);

            // Удаляем врага
            enemy.remove();
            enemies = enemies.filter(e => e !== enemy);

            // Проверка победы
            if (kills >= targetKills) {
                winGame();
            }
        }

        function createBulletHole(x, y) {
            const hole = document.createElement('div');
            hole.style.position = 'absolute';
            hole.style.left = x + 'px';
            hole.style.top = y + 'px';
            hole.style.width = '6px';
            hole.style.height = '6px';
            hole.style.background = '#000';
            hole.style.borderRadius = '50%';
            hole.style.border = '2px solid #555';
            hole.style.transform = 'translate(-50%, -50%)';
            hole.style.pointerEvents = 'none';
            hole.style.zIndex = 5;
            room.appendChild(hole);
        }

        // Спавн врагов (Прятки)
        function spawnEnemy() {
            if (!isPlaying || kills >= targetKills) return;

            // Не спавним слишком много врагов одновременно
            if (enemies.length < 3) {
                const enemy = document.createElement('div');
                enemy.classList.add('enemy');
                enemy.textContent = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
                
                // Случайная позиция (но не по краям экрана, чтобы не обрезались)
                const x = Math.random() * 80 + 10; // от 10% до 90%
                const y = Math.random() * 80 + 10;
                
                enemy.style.left = x + 'vw';
                enemy.style.top = y + 'vh';
                
                // Анимация появления
                enemy.animate([
                    { transform: 'scale(0)' },
                    { transform: 'scale(1)' }
                ], { duration: 300 });

                room.appendChild(enemy);
                enemies.push(enemy);

                // Логика пряток: враг исчезает через некоторое время
                // Чем больше убито, тем меньше времени они показываются
                const showTime = Math.max(1000, 3000 - (kills * 150)); 
                
                setTimeout(() => {
                    if (enemy.parentNode) {
                        enemy.remove();
                        enemies = enemies.filter(e => e !== enemy);
                    }
                }, showTime);
            }

            // Планируем следующий спавн
            const nextSpawnDelay = Math.max(600, 1500 - (kills * 80));
            spawnTimeout = setTimeout(spawnEnemy, nextSpawnDelay);
        }

        function winGame() {
            isPlaying = false;
            clearTimeout(spawnTimeout);
            
            overlay.style.display = 'flex';
            document.getElementById('overlay-title').textContent = "Миссия выполнена!";
            document.getElementById('overlay-title').style.color = "#00ff00";
            document.getElementById('overlay-title').style.textShadow = "0 0 20px #00ff00";
            document.getElementById('overlay-text').innerHTML = "Все цели уничтожены. Ты настоящий снайпер!";
            
            const btn = document.getElementById('start-btn');
            btn.textContent = "Играть снова";
            btn.style.borderColor = "#00ff00";
            btn.style.boxShadow = "0 0 15px rgba(0, 255, 0, 0.3)";
        }
    </script>
</body>
</html>
